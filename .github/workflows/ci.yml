name: CI

on:
  push:
    branches: ['2.x', '3.x']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer audit
      - run: composer cs:check
      - run: composer stan

  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.4.*']
        deps: ['highest']
        exclude:
          - { php: '8.1', symfony: '7.4.*' }   # Symfony 7.4 requiere PHP 8.2+
        include:
          - { php: '8.1', symfony: '6.4.*', deps: 'lowest' }
          - { php: '8.2', symfony: '7.4.*', deps: 'lowest' }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install Symfony Flex (to pin the Symfony version)
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
      - name: Pin Symfony version
        run: composer config extra.symfony.require "${{ matrix.symfony }}"
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-stable ${{ matrix.deps == 'lowest' && '--prefer-lowest' || '' }}
      - run: composer test